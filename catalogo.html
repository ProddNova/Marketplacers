<meta property="og:title" content="Catalogo — FERMO">
<meta property="og:description" content="Cerca capacità produttiva ferma: CNC, stampa 3D, taglio laser, laboratori, magazzini, furgoni e attrezzature.">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23C2410C'/><text x='16' y='23' font-size='19' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle'>F</text></svg>">
</head>
<body>

<!-- ================================================= FASCIA DI RICERCA -->
<div class="cima">
  <div class="contenitore">
    <div class="pila">

      <form id="modulo-ricerca" role="search" class="cerca">
        <label class="sr" for="q">Cerca nel catalogo</label>
        <span id="icona-lente"></span>
        <input type="search" id="q" name="q" autocomplete="off"
               placeholder="Fresa, cella frigo, laser, Brescia…">
      </form>

      <div class="riga riga--stretta" style="gap:8px">
        <button class="chip" type="button" id="apri-filtri">
          <span id="icona-filtro"></span>Filtri<span class="bollo nascosto" id="conta-filtri">0</span>
        </button>
        <label class="sr" for="ordina">Ordina i risultati</label>
        <select class="chip" id="ordina">
          <option value="rilevanza">Più pertinenti</option>
          <option value="ore">Più ore libere</option>
          <option value="prezzo-su">Prezzo crescente</option>
          <option value="prezzo-giu">Prezzo decrescente</option>
          <option value="voto">Meglio valutati</option>
          <option value="pronto">Disponibile prima</option>
        </select>
        <button class="chip spinta" type="button" id="commuta-mappa" aria-pressed="false">
          <span id="icona-mappa"></span>Mappa
        </button>
      </div>

      <div class="fila-chip" id="chip-categorie" role="group" aria-label="Filtra per categoria"></div>

    </div>
  </div>
</div>

<main class="pagina contenitore">

  <div class="riga riga--fra" style="margin:14px 0 12px">
    <span class="piccolo tenue" id="stato-conteggio">—</span>
    <button class="link piccolo nascosto" type="button" id="pulisci">Azzera i filtri</button>
  </div>

  <div class="riga" id="gettoni" style="margin-bottom:14px"></div>

  <!-- ================================ MAPPA DELLE SEDI -->
  <section class="carta nascosto" id="pannello-quadro" style="margin-bottom:18px">
    <div class="carta__testa">
      Dove sta il ferro
      <span class="spinta piccolo fioco" id="quadro-letto">Tocca una sede per filtrare</span>
    </div>
    <div class="carta__corpo">
      <div id="quadro-innesto"></div>
      <details class="apribile">
        <summary>Elenco delle sedi</summary>
        <div class="scorre" style="max-height:280px;margin-top:10px">
          <table class="tabella" id="quadro-tabella">
            <thead><tr><th>Sede</th><th class="num">Schede</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
      <p class="piccolo fioco" style="margin-top:12px">
        Proiezione delle sedi reali dei fornitori: il punto cresce dove una città ha
        più schede. Nessun contorno disegnato — la sagoma esce dalle sedi stesse,
        e il vuoto al Sud è copertura che manca davvero.
      </p>
    </div>
  </section>

  <!-- ================================ RISULTATI -->
  <div class="elenco-beni" id="risultati"></div>
  <div id="niente"></div>

</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/demo.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/catalogo.js"></script>
</body>
</html>
